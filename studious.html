<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studious</title>
    <link rel="stylesheet" href="CSS/studious.css">
</head>
<body>
  
  <header class="navbar">
  <a href="home.html" target="content" class="navbar__brand" style="text-decoration: none; color: inherit;">
  <img src="icons/logo.svg" alt="Study Manager logo" class="navbar__logo">
  <p class="description">Plan smarter. Study better</p>
</a>

    <button class="navbar__toggle" aria-label="Toggle menu" aria-expanded="false"
            onclick="this.setAttribute('aria-expanded', this.getAttribute('aria-expanded') === 'false'); document.querySelector('.navbar__links').classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>

    <nav class="navbar__links">
      <a href="dashboard.html" target="content" class="active">Dashboard</a>
      <a href="task.html" target="content">Tasks</a>
      <a href="notes.html" target="content">Notes</a>
      <a href="goal.html" target="content">Goals</a>
      <a href="schedule.html" target="content">Schedule</a>
    </nav>
  </header>

  <!-- Pages open here -->
  <iframe name="content" class="content-frame" src="home.html" title="Studious pages"></iframe>

  <script>
    // highlight the clicked link and close the mobile menu
    const links = document.querySelectorAll('.navbar__links a');
    links.forEach(link => link.addEventListener('click', () => {
      links.forEach(l => l.classList.remove('active'));
      link.classList.add('active');
      document.querySelector('.navbar__links').classList.remove('open');
    }));
  </script>
</body>
</html>
