<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studious – Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/dashboard.css">
</head>
<body>

  <!-- ========== HEADER (same as your other pages) ========== -->


  <main class="page">

    <!-- ========== WELCOME ========== -->
    <section class="welcome">
      <div>
        <span class="pill">
          <img src="icons/check-circle (1).svg" alt="" width="22" height="22">
          Dashboard overview
        </span>
        <h1 class="welcome__title">Welcome back!</h1>
        <p class="welcome__date" id="today-date">Wednesday, 28 October 2026</p>
      </div>

      <div class="quick-actions">
        <a href="tasks.html" class="btn btn--primary">
          <img src="icons/plus_icon.svg" alt="" width="18" height="18"> Add task
        </a>
        <a href="notes.html" class="btn btn--soft">
          <img src="icons/notes.svg" alt="" width="18" height="18"> New note
        </a>
        <a href="schedule.html" class="btn btn--soft">
          <img src="icons/calendar.svg" alt="" width="18" height="18"> Add event
        </a>
      </div>
    </section>

    <!-- ========== STATS ========== -->
    <section class="stats" aria-label="Summary">
      <article class="stat">
        <div class="icon-tile"><img src="icons/tasks.svg" alt="" width="28" height="28"></div>
        <div>
          <p class="stat__value" id="stat-tasks">5</p>
          <p class="stat__label">Pending tasks</p>
        </div>
      </article>

      <article class="stat">
        <div class="icon-tile"><img src="icons/check-circle-outline.svg" alt="" width="28" height="28"></div>
        <div>
          <p class="stat__value" id="stat-completed">3</p>
          <p class="stat__label">Completed</p>
        </div>
      </article>

      <article class="stat">
        <div class="icon-tile"><img src="icons/calendar.svg" alt="" width="28" height="28"></div>
        <div>
          <p class="stat__value" id="stat-events">2</p>
          <p class="stat__label">Events today</p>
        </div>
      </article>

      <article class="stat">
        <div class="icon-tile"><img src="icons/notes.svg" alt="" width="28" height="28"></div>
        <div>
          <p class="stat__value" id="stat-notes">8</p>
          <p class="stat__label">Notes</p>
        </div>
      </article>
    </section>
        <!-- ========== STUDY QUOTE ========== -->
    <section class="quote" aria-label="Study quote">
      <div class="quote__icon">
        <img src="icons/qoute_icon.svg" alt="" width="28" height="28">
      </div>

      <figure class="quote__content">
        <blockquote class="quote__text" id="quote-text">
          The expert in anything was once a beginner.
        </blockquote>
        <figcaption class="quote__author" id="quote-author">— Helen Hayes</figcaption>
      </figure>

    
    </section>

   
  </main>

  <script src="js/dashboard.js"></script>
</body>
</html>
